<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <marquee
      behavior="across"
      direction=""
      scrollamount="20"
      bgcolor="lightblue"
    >
      <h1>marquee Tag</h1>
    </marquee>
    <marquee behavior="scroll" direction="right" bgcolor="lightcoral">
        <h1>marquee tag</h1>
    </marquee>
    <marquee behavior="scroll" direction="up" bgcolor="lightgreen">
        <h1>marquee tag</h1>
    </marquee>
    <marquee behavior="scroll" direction="down" bgcolor="yellow">
        <h1>marquee tag</h1>
  </body>
</html>
