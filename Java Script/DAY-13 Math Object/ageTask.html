<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Age calculator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <section class="w-full h-screen flex flex-col items-center p-5">
      <h1 class="text-2xl font-semibold mb-3">Age calculator</h1>
      <h1>Age Calculator</h1>
      <div>
        <input
          type="date"
          id="birthDate"
          class="outline-none border border-gray-300 p-2 focus:ring-1 focus:ring-blue-600 transition"
        />
        <input
          type="date"
          id="currentDate"
          class="outline-none border border-gray-300 p-2 focus:ring-1 focus:ring-blue-600 transition"
        />
        <button
          class="text-white p-2 bg-blue-600 rounded"
          onclick="calculateAge()"
        >
          Calculate age
        </button>
      </div>
      <h2 id="result" class="mt-4 text-xl font-semibold text-red-600"></h2>
    </section>
    <script src="calculateAgeTask.js"></script>
  </body>
</html>
