<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* Pseudo element selector (::marker) */
      li {
        color: green;
      }
      li::marker {
        color: red;
      }
      input::placeholder {
        font-size: 10px;
        color: blue;
      }
      input {
        outline: none;
        caret-color: rebeccapurple;
      }
    </style>
  </head>
  <body>
    <ul>
      <li>Item 1</li>
      <li>Item 2</li>
      <li>Item 3</li>
    </ul>
    <input type="text" placeholder="Enter your name" />
  </body>
</html>
