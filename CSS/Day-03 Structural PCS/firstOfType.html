<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* first-of-type selector */
      h2:first-of-type {
        color: white;
        background-color: orange;
        padding: 10px;
      }
      p:first-of-type {
        color: white;
        background-color: purple;
        padding: 10px;
      }
    </style>
  </head>
  <body>
    <h1>First-of-type</h1>
    <h2>heading-2</h2>
    <p>sub eading</p>
    <div>
      <h2>heading inside div</h2>
      <p>paragraph inside div</p>
      <h2>another heading inside div</h2>
      <p>another paragraph inside div</p>
    </div>
    <p>sub heading-2</p>
  </body>
</html>
