<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* nth child selector */
      p:nth-child(2n) {
        color: blue;
        background-color: lightgreen;
        padding: 10px;
        margin: 5px;
      }
      p:nth-child(2n + 1) {
        color: red;
        background-color: lightyellow;
        padding: 10px;
        margin: 5px;
      }
      p:nth-child(5n) {
        color: white;
        background-color: black;
        padding: 10px;
        margin: 5px;
      }
      p:nth-child(3n + 1) {
        color: yellow;
        background-color: purple;
        padding: 10px;
        margin: 5px;
      }
      p:nth-child(8) {
        color: green;
        background-color: gray;
        padding: 10px;
        margin: 5px;
      }
    </style>
  </head>
  <body>
    <p>paragraph number 1</p>
    <p>paragraph number 2</p>
    <p>paragraph number 3</p>
    <p>paragraph number 4</p>
    <p>paragraph number 5</p>
    <p>paragraph number 6</p>
    <p>paragraph number 7</p>
    <p>paragraph number 8</p>
    <p>paragraph number 9</p>
    <p>paragraph number 10</p>
  </body>
</html>
