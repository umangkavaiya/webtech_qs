<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* * {
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
      } */
      .box {
        height: 200px;
        width: 200px;
        background-color: aqua;
        /* transition: border-radius;
        transition-duration: 2s;
        transition-timing-function: linear;
        transition-delay: 2s; */

        transition: all 2s linear; /*all can be given in one transition property */
      }
      .box:hover {
        border-radius: 50%;
        background-color: blueviolet;
        transform: translate(200px);
      }
    </style>
  </head>
  <body>
    <h1>Transition with translate properties</h1>
    <div class="box"></div>
  </body>
</html>
