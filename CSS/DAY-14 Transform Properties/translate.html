<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
      }
      .box {
        height: 200px;
        width: 200px;
        background-color: aqua;
      }
      .box:hover {
        transform: translate(200px);
      }
    </style>
  </head>
  <body>
    <h1>Translate properties</h1>
    <div class="box"></div>
  </body>
</html>
