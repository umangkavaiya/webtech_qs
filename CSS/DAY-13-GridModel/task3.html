<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
        font-family: Georgia, "Times New Roman", Times, serif;
      }

      .container {
        width: 100vw;
        height: 100vh;
        display: grid;
        grid-template-columns: repeat(4, auto);
        grid-template-rows: repeat(5, auto);
        /* border: 1px solid black; */
        background-color: antiquewhite;
        gap: 10px;
      }
      .box {
        border: 1px solid black;
        background-repeat: no-repeat;
        background-position: center;
      }
      #box1 {
        background-image: url(https://i.pinimg.com/736x/c6/e2/b1/c6e2b190445db3bfe87e6a9be9be2019.jpg);
        background-size: contain;
        background-color: rgba(13, 12, 12);
      }

      #box2 {
        grid-row: 1/5;
        grid-column: 2/4;
        background-size: contain;
        background-color: rgb(191, 32, 32);
        /* display: flex;
        flex-direction: column; */
      }
      #box2 > div {
        flex-direction: column;
      }
      #box4 {
        grid-column: 1;
        grid-row: 2/6;
        background-image: url(https://i.pinimg.com/736x/4b/dc/6c/4bdc6c70cbf8893f6213385191b1ac28.jpg);
        background-size: cover;
      }
      #box7 {
        grid-row: 2/6;
        background-image: url(https://i.pinimg.com/736x/a3/e5/7e/a3e57e0424b172edf8d4d04873ced7e5.jpg);
        background-size: cover;
      }
      #box3 {
        background-image: url(https://i.pinimg.com/736x/cc/91/b5/cc91b541ad035924a9ac2a39a5c3645b.jpg);
        background-size: cover;
      }
      #box5 {
        background-image: url(https://i.pinimg.com/736x/35/cc/42/35cc42f4153ca913095639cb9936cfd8.jpg);

        background-size: cover;
      }
      #box6 {
        background-image: url(https://i.pinimg.com/736x/02/bc/09/02bc09693795d1046eb906cd1a7e49e7.jpg);
        background-size: cover;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box" id="box1"></div>
      <div class="box" id="box2">
        <div><h2>Register Here</h2></div>
        <div id="registerform">
          <form action="">
            <input type="text" placeholder="Name" />
            <input type="email" name="" id="" placeholder="Enter your email" />
            <textarea name="" id="" placeholder="Message..."></textarea>
            <input type="submit" value="" />
          </form>
        </div>
      </div>
      <div class="box" id="box3"></div>
      <div class="box" id="box4"></div>
      <div class="box" id="box5"></div>
      <div class="box" id="box6"></div>
      <div class="box" id="box7"></div>
    </div>
  </body>
</html>
