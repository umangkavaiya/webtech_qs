<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
        font-family: Georgia, "Times New Roman", Times, serif;
      }
      .layout {
        width: 100vw;
        height: 100vh;
        display: grid;
        grid-template-columns: repeat(6, auto);
        grid-template-rows: repeat(4, auto);
        /* background-color: blueviolet; */
        color: rgb(209, 215, 220);
        padding: 40px 200px;
      }
      body {
        background-color: antiquewhite;
      }
      .box {
        border: 1px solid black;
        gap: 10px;
        border-radius: 6px;
        box-shadow: rgba(207, 207, 210, 0.2) 0px 7px 10px 0px;
        /* background-color: cadetblue; */
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
        /* justify-items: center;
        align-items: center; */
      }
      #box1 {
        grid-column: 1/7;
        margin-bottom: 40px;
        color: aliceblue;
        background-color: black;
        font-size: 40px;
        margin: auto;
        padding-left: 30px;
        padding-right: 30px;
      }
      div h2 {
        margin: 20px auto;
        background-color: rgba(0, 0, 0, 0.5);
        justify-self: center;
        padding: 10px;
        border-radius: 5px;
      }
      #box2 {
        grid-column: 1/4;
        background-image: url(https://img.freepik.com/free-vector/game-landscape-with-tropical-plants_105738-749.jpg?semt=ais_user_personalization&w=740&q=80);
        background-repeat: no-repeat;
        background-size: cover;
      }
      #box3 {
        grid-row: 2/5;
        grid-column: 4/7;
        background-image: url(https://images.stockcake.com/public/8/4/6/846d2b6a-4e7f-4015-a6a6-34e4e681714d_large/snowy-mountain-peak-stockcake.jpg);
      }
      #box4 {
        grid-column: 1/3;
        background-image: url(https://media.gettyimages.com/id/481618375/photo/young-tuareg-with-camel-on-western-sahara-desert-in-africa.jpg?s=612x612&w=gi&k=20&c=hg9Ypzk0-aI0hKRm0-zMKQuiC30gQ4Oh3GCsEVdKC_8=);
      }
      #box5 {
        grid-column: 3;
        grid-row: 3/5;
        background-image: url(https://media.istockphoto.com/id/1442179368/photo/maldives-island.jpg?s=612x612&w=0&k=20&c=t38FJQ6YhyyZGN91A8tpn3nz9Aqcy_aXolImsOXOZ34=);
      }
      #box6 {
        background-image: url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTVheQEL5bGyvCucGcvik9-gySQsmodc-NvDA&s);
      }
      #box7 {
        background-image: url(https://img.freepik.com/free-photo/photorealistic-view-tree-nature-with-branches-trunk_23-2151478106.jpg?semt=ais_hybrid&w=740&q=80);
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <div class="box" id="box1"><h1>Nature's Gallery</h1></div>
      <div class="box" id="box2">
        <h2>Jungles</h2>
      </div>
      <div class="box" id="box3">
        <h2>Mountains</h2>
      </div>
      <div class="box" id="box4"><h2>Desert</h2></div>
      <div class="box" id="box5"><h2>Beach</h2></div>
      <div class="box" id="box6"><h2>Icebergs</h2></div>
      <div class="box" id="box7"><h2>Rain</h2></div>
    </div>
  </body>
</html>
