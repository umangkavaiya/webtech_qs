<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* Adjacent sibling selector(+) */
      h1 + p {
        color: green;
        background-color: lightgray;
      }
      h2 + p {
        color: blue;
        background-color: lightyellow;
      }
    </style>
  </head>
  <body>
    <h1>Adjacent Sibling Selector</h1>
    <div>
      <h1>title</h1>
      <p>subtitle 1</p>
      <p>subtitle 2</p>
      <h2>heading</h2>
      <p>subtitle 3</p>
      <p>subtitle 4</p>
    </div>
  </body>
</html>
