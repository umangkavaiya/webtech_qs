<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* Grouping combination selector */
      h1, p {
        color: white;
        background-color: teal;
        margin: 10px;
        padding: 10px;
      }
      </style
  </head>
  <body>
    <h1>Grouping Combination Selector</h1>
    <p>this is a paragraph 1</p>
    <p>this is a paragraph 2</p>
    <p>this is a paragraph 3</p>
    <div>
        <h1>this is heading inside div</h1>
     </div>
  </body>
</html>
