<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* child selector(>) */
      div > p {
        color: purple;
        background-color: pink;
      }
      main > p {
        color: brown;
        background-color: lightgray;
      }
    </style>
  </head>
  <body>
    <h1>Combinator Selectors</h1>
    <h2>2. Child selector</h2>
    <div>
      <h1>Heading -1</h1>
      <p>This is a paragraph 1</p>
      <main>
        <h1>heading -2</h1>
        <p>This is a paragraph 2</p>
        <article>
          <p>This is a paragraph 3 inside article</p>
        </article>
      </main>
    </div>
  </body>
</html>
