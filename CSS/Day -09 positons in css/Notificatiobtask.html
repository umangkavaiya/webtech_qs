<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      #content {
        width: 200px;
        height: 100px;
        border: 1px solid black;
        border-radius: 8px;
        font-size: large;
        margin-top: 20px;
        margin-left: 20px;
        box-shadow: rgba(0, 0, 0, 0.6);
        background-color: green;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      span {
        width: 40px;
        height: 40px;
        position: absolute;
        font-size: 15px;
        color: white;
        background-color: red;
        display: flex;
        align-items: center;
        justify-content: center;
        right: -20px;
        top: -15px;
        clip-path: polygon(
          0% 0%,
          100% 0%,
          100% 75%,
          75% 75%,
          75% 100%,
          50% 75%,
          0% 75%
        );
      }
    </style>
  </head>
  <body>
    <div id="content">
      <span>50+</span>
      Whatsapp
    </div>
  </body>
</html>
