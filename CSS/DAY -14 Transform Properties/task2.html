<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
        font-family:
          "Franklin Gothic Medium", "Arial Narrow", Arial, sans-serif;
      }

      body {
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        /* border: 1px solid   black; */
      }
      img {
        height: 100%;
        height: 100%;
        object-fit: cover;
        transition: all 0.3s linear;
      }
      .parent {
        width: 30%;
        border: 2px solid black;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .child {
        border: 2px solid red;
        width: 90%;
        height: 90%;
        display: flex;
        flex-direction: column;
        padding: 20px;
        gap: 20px;
      }
      .sub-child {
        width: 90%;
        height: 95%;
        border: 2px solid blue;
        border-radius: 10px;
        /* overflow: hidden; */
      }
      child > p {
        color: rgb(37, 37, 37);
      }

      .parent:hover {
        background-color: blueviolet;
      }
    </style>
  </head>
  <body>
    <h1>Parent Hover Demo</h1>
    <div class="parent">
      <div class="child">
        <h1>Real Estate</h1>
        <p>Enterprise, Process Automation</p>
        <div class="sub-child" id="sub-child1">
          <img
            src="https://notionmind.com/_next/static/media/Conrex.53da3d7f.webp"
            alt=""
          />
        </div>
      </div>
    </div>
  </body>
</html>
