<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        /* background-color: black; */
        /* color: white; */
        font-family: Georgia, "Times New Roman", Times, serif;
      }
      .parent {
        width: 90%;

        background-color: black;
        display: flex;
        justify-content: space-evenly;
        align-items: center;
        padding: 80px 50px;
        border-radius: 3px;
      }
      .box {
        width: 200px;
        height: 200px;
        background-color: orangered;
        display: flex;
        justify-content: center;
        align-items: center;
        color: aliceblue;
        border-radius: 7px;
        font-size: 25px;
        transition: all 0.5s linear;
      }
      .box:nth-child(1):hover {
        transform: rotate(45deg);
      }
    </style>
  </head>
  <body>
    <h1>rotate property in CSS</h1>
    <div class="parent">
      <div class="box" id="box1">Rotate-Z</div>
      <div class="box" id="box2">Rotate-X</div>
      <div class="box" id="box3">Rotate-Y</div>
    </div>
  </body>
</html>
