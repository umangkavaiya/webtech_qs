<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }
        body{
            height: 100vh;  
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .parent{
            width: 600px;
            height: 400px;
            border: 1px solid black;
            background-color: lightblue;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-evenly;
            align-items: center;
            /* align-content: center;  it will work for entire row and by default its value is apce around */
        }
        .child{
            width: 100px;
            /* flex-basis: 100px; */
            height: 100px;
            border: 1px solid black;
            background-color: lightcoral;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            
        }
        h1{
            margin-bottom: 20px;
            
        }
        #Child-1{
            align-self: flex-start;
        }
        #Child-5{
            align-self: flex-end;
        }
        
    </style>
</head>
<body>
    <h1>flex basis(providing initial width) properties and align self properties</h1>
    <div class="parent" id="parent1">
        <div class="child" id="Child-1">Child-1</div>
        <div class="child" id="Child-2">Child-2</div>
        <div class="child" id="Child-3">Child-3</div>
        <div class="child" id="Child-4">Child-4</div>
        <div class="child" id="Child-5">Child-5</div>
        
</body>
</html>
