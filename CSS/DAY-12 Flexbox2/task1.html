<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
        font-family: "Times New Roman", Times, serif;
      }
      header {
        width: 100%;
        border: 1px solid;
        height: 72px;
        background-color: white;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      aside {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      div img {
        width: 200px;
        height: 50px;
        border: 1px solid black;
        margin-left: 15px;
      }
      nav {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        border: 1px solid black;
        flex-grow: 1;
        padding-right: 0%;
      }
      ul {
        width: 600px;
        height: 72px;
        display: flex;
        align-items: center;
        justify-content: space-evenly;
      }
      ul li {
        list-style: none;
        font-family: "DM Sans", Sans-serif;
        border: 1px solid black;
        padding: 8px 12px;
      }
      a {
        text-decoration: none;
        color: black;
      }
      div button {
        border: 1px solid black;
        padding: 8px 12px;
        font-family: "DM Sans", Sans-serif;
        background-color: white;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #button {
        color: blue;
        background-color: aqua;
      }
    </style>
  </head>
  <body>
    <header>
      <aside>
        <div>
          <img src="imgi_4_Inextrix_logo-2-1 (1).png" alt="logo" />
        </div>
      </aside>
      <nav>
        <div>
          <ul>
            <li><a href="">Services</a></li>
            <li><a href="">Solutions</a></li>
            <li><a href="">Our Products</a></li>
            <li><a href="">Hire Developers</a></li>
            <li><a href="">About</a></li>
          </ul>
        </div>
      </nav>
      <div id="button">
        <button>Lets Talk</button>
      </div>
    </header>
  </body>
</html>
