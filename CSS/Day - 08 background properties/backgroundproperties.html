<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        padding: 0px;
        margin: 0px;
        box-sizing: border-box;
        text-align: center;
        font-family: "Times New Roman", Times, serif;
      }

      h1 {
        padding: 20px;
      }

      .box {
        width: 500px;
        height: 200px;
        border: 1px solid;
        margin: 20px auto;
      }

      #box1 {
        background-color: aqua;
      }
      #box2 {
        background-image: url("https://www.thoughtco.com/thmb/opOLmUB6q9fHOlke7cuY8YceMfY=/1500x0/filters:no_upscale():max_bytes(150000):strip_icc()/GettyImages-1086740226-5c2d625a4cedfd00016ed36c.jpg");
        background-repeat: no-repeat;
        background-size: contain;
        width: 800px;
        height: 600px;
      }
    </style>
  </head>
  <body>
    <h1>Background properties in CSS</h1>
    <div class="box" id="box1"></div>
    <div class="box" id="box2"></div>
    <div class="box" id="box3"></div>
    <div class="box" id="box4"></div>
    <div class="box" id="box5"></div>
    <div class="box" id="box6"></div>
  </body>
</html>
