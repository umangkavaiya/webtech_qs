<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
        font-family: "Times New Roman", Times, serif;
      }
      header {
        width: 100%;
        height: 100px;
        background-image: url("https://images.unsplash.com/photo-1506744038136-46273834b3fb?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8bGFuZHNjYXBlJTIwYmFja2dyb3VuZHxlbnwwfHwwfHx8MA%3D%3D&auto=format&fit=crop&w=500&q=60");
        background-size: cover;
        background-position: center;
      }
      h1 {
        font-size: 40px;
        color: #333;
        margin: 20px auto;
        text-align: center;
      }
      h2 {
        font-size: 20px;
        color: #666;
        margin: 30px auto;
        text-align: center;
      }
      section {
        width: 80%;
        margin: 0px auto;
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        border: 1px solid #ccc;
      }
      .container {
        width: 250px;
        height: 150px;
        border: 1px solid #ccc;
        padding: 10px;
        margin: 20px auto;
        position: relative;
        background-image: url(https://thumbs.dreamstime.com/b/modern-house-interior-exterior-design-46517595.jpg);
        background-repeat: no-repeat;
        background-size: cover;

        background-position: center;
      }
      .address {
        width: 90%;
        height: 120px;
        background-color: #f0f0f0;
        margin: 10px auto;
        position: relative;
        background-color: rgba(0, 0, 0, 0.5);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .price {
        width: 70px;
        height: 20px;
        background-color: #4caf50;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 5px;
        position: absolute;
        left: 35%;
        bottom: 10%;
      }
      .forrent {
        width: 60px;
        height: 15px;
        margin-top: 2px;

        background-color: #2196f3;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 5px;
        position: absolute;
        top: 0%;
      }
    </style>
  </head>
  <body>
    <header></header>
    <h1>Recent Properties</h1>
    <h2>Discover how much latest Properties have been sold for</h2>

    <section>
      <div class="container">
        <div class="address">
          <div class="price">$1000</div>
          <p>
            123 MG Road <br />
            Bengaluru <br />
            560001
          </p>
        </div>
        <div class="forrent"></div>
      </div>
      <div class="container">
        <div class="address">
          <div class="price">$2000</div>
        </div>
        <div class="forrent"></div>
      </div>
      <div class="container">
        <div class="address">
          <div class="price">$3000</div>
        </div>
        <div class="forrent"></div>
      </div>
      <div class="container">
        <div class="address">
          <div class="price">$4000</div>
        </div>
        <div class="forrent"></div>
      </div>
      <div class="container">
        <div class="address">
          <div class="price">$5000</div>
        </div>
        <div class="forrent"></div>
      </div>
      <div class="container">
        <div class="address">
          <div class="price">$6000</div>
        </div>
        <div class="forrent"></div>
      </div>
      <div class="container">
        <div class="address">
          <div class="price">$7000</div>
        </div>
        <div class="forrent"></div>
      </div>
      <div class="container">
        <div class="address">
          <div class="price">$8000</div>
        </div>
        <div class="forrent"></div>
      </div>
    </section>
  </body>
</html>
