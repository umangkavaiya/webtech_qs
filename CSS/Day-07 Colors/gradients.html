<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        padding: 0px;
        margin: 0px;
        box-sizing: border-box;
        font-family:
          "Lucida Sans", "Lucida Sans Regular", "Lucida Grande",
          "Lucida Sans Unicode", Geneva, Verdana, sans-serif;
      }
      h1 {
        text-align: center;
        padding: 10px;
        margin: 2px;
      }
      .box {
        width: 500px;
        height: 200px;
        border: 1px solid;
        margin: 30px auto;
      }
      #box1 {
        background-image: linear-gradient(red, yellow);
      }
      #box2 {
        background-image: linear-gradient(blue, violet);
      }
      #box3 {
        background-image: linear-gradient(
          to bottom,
          red,
          orange,
          yellow,
          green,
          blue,
          indigo,
          violet
        );
      }
      #box4 {
        background-image: linear-gradient(
          45deg,
          red,
          orange,
          yellow,
          green,
          blue,
          indigo,
          violet
        );
      }
      #box5 {
        background-image: linear-gradient(
          to right,
          red,
          orange,
          yellow,
          green,
          blue,
          indigo,
          violet
        );
      }
      #box6 {
        background-image: linear-gradient(
          to bottom right,
          red,
          orange,
          yellow,
          green,
          blue,
          indigo,
          violet
        );
      }
      #box7 {
        background-image: linear-gradient(
          #ff671f 0% 33%,
          #ffffff 33% 66%,
          #046a38 66% 100%
        );
        position: relative;
      }
      img {
        width: 65px;
        position: absolute;
        border-radius: 50%;
        left: 40%;
        top: 33%;
      }
    </style>
  </head>
  <body>
    <h1>Linear Gradients in CSS</h1>
    <div class="box" id="box1"></div>
    <div class="box" id="box2"></div>
    <div class="box" id="box3"></div>
    <div class="box" id="box4"></div>
    <div class="box" id="box5"></div>
    <div class="box" id="box6"></div>
    <div class="box" id="box7">
      <img src="image.png" alt="ashok cahkra" />
    </div>
  </body>
</html>
